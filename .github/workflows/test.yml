name: test

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  mutation:
    # Hand-written mutants (scripts/mutate.py): every deliberate bug must make a test fail.
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/mutate.py

  arc-fork:
    # Read-only checks against the real Arc stablecoins over the public RPC (network-dependent, so non-blocking).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: forge test --match-contract ArcFork --fork-url https://rpc.mainnet.arc.io -vv

  e2e:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r e2e/requirements.txt && python -m playwright install --with-deps chromium
      - run: python e2e/test_e2e.py
