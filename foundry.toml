[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "prague"   # Arc targets the Osaka baseline; Prague bytecode is a safe subset
optimizer = true
optimizer_runs = 1_000
fuzz = { runs = 1000 }

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[lint]
# The mock token intentionally mirrors FiatToken's public names (name, symbol, DOMAIN_SEPARATOR).
exclude_lints = ["mixed-case-function", "screaming-snake-case-const"]

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"
local = "http://127.0.0.1:8545"
